services:
  nexus:
    build: .
    env_file: .env
    environment:
      NEXUS_DB_PATH: /srv/nexus/data/nexus.db
      # To reach Ollama running on the Docker host, use host.docker.internal.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - nexus_data:/srv/nexus/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

volumes:
  nexus_data:
