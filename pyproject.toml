[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-starship-guardians"
version = "0.5.1"
description = "Nexus Starship Guardians: verified multi-project Guardian runtime with Intelligence Fabric, fingerprinted fixed-corpus evaluation, learning, adaptive routing, controlled tool policy, and distributed execution foundations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.27,<2",
]

[project.scripts]
nexus-guardians = "nexus_os.portable.cli:main"
nexus-portable = "nexus_os.portable.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "build>=1.2,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["nexus_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
