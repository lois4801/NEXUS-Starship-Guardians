[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-starship-guardians"
version = "0.9.0"
description = "Reusable Guardian engineering runtime for Lucio AI Platform, Ember, Nexus Code, and future applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lois4801" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "psutil>=5.9",
  "jsonschema>=4.21",
  "cryptography>=42.0",
  "python-multipart>=0.0.9",
  "websockets>=12.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "greenlet>=3.0",
  "tenacity>=8.2",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.9",
  "types-pyyaml>=6.0",
  "types-psutil>=5.9",
  "build>=1.1",
  "twine>=5.0",
]

[project.scripts]
nexus-guardians = "nexus_os.cli:main"
nexus-portable = "nexus_os.cli:main"

[tool.setuptools.packages.find]
include = ["nexus_os*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
