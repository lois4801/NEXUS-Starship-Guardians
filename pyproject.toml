[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-agentic-os"
version = "0.1.0"
description = "Nexus Starship Guardians: reusable multi-project Guardian runtime with scoped credentials, approval gates, execution swarms, and pluggable models"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
]

[project.scripts]
nexus-portable = "nexus_os.portable.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["nexus_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
