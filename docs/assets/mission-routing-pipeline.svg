<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
  <title id="title">Nexus Starship Guardians mission routing pipeline</title>
  <desc id="desc">Animated mission classification, capability mapping, Guardian routing, model judging and telemetry flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".55" stop-color="#071a36"/><stop offset="1" stop-color="#1b0b35"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1500" height="600" rx="30" fill="url(#bg)"/>
  <text x="70" y="72" fill="#e5f6ff" font-size="44" font-weight="800" font-family="Arial, Helvetica, sans-serif">Mission Intelligence &amp; Adaptive Routing</text>
  <text x="72" y="108" fill="#94a3b8" font-size="20" font-family="Arial, Helvetica, sans-serif">Translate intent into explicit capabilities, bounded Guardian teams, independent judgment, and durable evidence.</text>
  <path d="M130 280 H1370" stroke="url(#flow)" stroke-width="7" stroke-dasharray="18 17" opacity=".65" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-70" dur="2.4s" repeatCount="indefinite"/></path>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(60 170)"><rect width="220" height="210" rx="24" fill="#06192c" stroke="#22d3ee" stroke-width="2"/><text x="28" y="48" fill="#67e8f9" font-size="22" font-weight="700">MISSION</text><text x="28" y="90" fill="#cbd5e1" font-size="17">User goal</text><text x="28" y="120" fill="#cbd5e1" font-size="17">bug • feature</text><text x="28" y="150" fill="#cbd5e1" font-size="17">deploy • research</text><circle cx="188" cy="170" r="12" fill="#22d3ee"><animate attributeName="opacity" values=".25;1;.25" dur="1.4s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(305 170)"><rect width="220" height="210" rx="24" fill="#0b1630" stroke="#60a5fa" stroke-width="2"/><text x="24" y="48" fill="#93c5fd" font-size="22" font-weight="700">CLASSIFIER</text><text x="24" y="90" fill="#cbd5e1" font-size="17">Mission kind</text><text x="24" y="120" fill="#cbd5e1" font-size="17">Confidence</text><text x="24" y="150" fill="#cbd5e1" font-size="17">Team bounds</text></g>
    <g transform="translate(550 170)"><rect width="220" height="210" rx="24" fill="#15112e" stroke="#8b5cf6" stroke-width="2"/><text x="24" y="48" fill="#c4b5fd" font-size="22" font-weight="700">CAPABILITY MAP</text><text x="24" y="90" fill="#cbd5e1" font-size="17">Capabilities</text><text x="24" y="120" fill="#cbd5e1" font-size="17">Required tools</text><text x="24" y="150" fill="#cbd5e1" font-size="17">Matched rules</text></g>
    <g transform="translate(795 170)"><rect width="220" height="210" rx="24" fill="#16112a" stroke="#d946ef" stroke-width="2"/><text x="24" y="48" fill="#f0abfc" font-size="22" font-weight="700">ADAPTIVE ROUTER</text><text x="24" y="90" fill="#cbd5e1" font-size="17">Guardian Registry</text><text x="24" y="120" fill="#cbd5e1" font-size="17">Quality + reliability</text><text x="24" y="150" fill="#cbd5e1" font-size="17">Permission-safe team</text></g>
    <g transform="translate(1040 170)"><rect width="220" height="210" rx="24" fill="#1b1710" stroke="#f59e0b" stroke-width="2"/><text x="24" y="48" fill="#fde68a" font-size="22" font-weight="700">INDEPENDENT JUDGE</text><text x="24" y="90" fill="#cbd5e1" font-size="17">Alternate model</text><text x="24" y="120" fill="#cbd5e1" font-size="17">Structured JSON</text><text x="24" y="150" fill="#cbd5e1" font-size="17">Evidence bounded</text></g>
    <g transform="translate(1285 170)"><rect width="160" height="210" rx="24" fill="#09251e" stroke="#34d399" stroke-width="2"/><text x="22" y="48" fill="#6ee7b7" font-size="22" font-weight="700">EXECUTE</text><text x="22" y="90" fill="#cbd5e1" font-size="17">Correlated</text><text x="22" y="120" fill="#cbd5e1" font-size="17">Telemetry</text><text x="22" y="150" fill="#cbd5e1" font-size="17">Evidence</text></g>
  </g>
  <g transform="translate(155 430)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1190" height="105" rx="22" fill="#05111f" stroke="#1d4ed8"/>
    <text x="30" y="38" fill="#38bdf8" font-size="19" font-weight="700">CROSS-PROJECT LEARNING</text>
    <text x="30" y="72" fill="#cbd5e1" font-size="17">Lucio</text><text x="110" y="72" fill="#64748b">+</text><text x="145" y="72" fill="#cbd5e1" font-size="17">Ember</text><text x="230" y="72" fill="#64748b">+</text><text x="265" y="72" fill="#cbd5e1" font-size="17">Nexus Code</text><text x="375" y="72" fill="#64748b">→</text><text x="415" y="72" fill="#a78bfa" font-size="17">Persistent performance history</text><text x="665" y="72" fill="#64748b">→</text><text x="705" y="72" fill="#34d399" font-size="17">Better future routing</text>
    <circle cx="1140" cy="55" r="13" fill="#34d399" filter="url(#glow)"><animate attributeName="r" values="9;18;9" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
