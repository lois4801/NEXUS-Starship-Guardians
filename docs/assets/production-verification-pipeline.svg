<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">Nexus Starship Guardians Production Verification</title>
  <desc id="desc">Animated production verification pipeline showing source changes flowing through compatibility, live API, Docker, PostgreSQL, evidence and promotion gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1500" height="620" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" fill="#e2f7ff" font-size="44" font-weight="800" font-family="Arial, Helvetica, sans-serif">Production Verification Grid</text>
  <text x="72" y="108" fill="#94a3b8" font-size="20" font-family="Arial, Helvetica, sans-serif">Every change must earn evidence before promotion.</text>
  <path d="M120 300 H1380" stroke="url(#line)" stroke-width="8" stroke-linecap="round" stroke-dasharray="22 18" opacity=".62" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-80" dur="2.5s" repeatCount="indefinite"/></path>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(70 180)"><rect width="190" height="170" rx="22" fill="#071b2e" stroke="#22d3ee" stroke-width="2"/><text x="28" y="48" fill="#67e8f9" font-size="22" font-weight="700">SOURCE CHANGE</text><text x="28" y="88" fill="#cbd5e1" font-size="17">Code</text><text x="28" y="116" fill="#cbd5e1" font-size="17">Tests</text><text x="28" y="144" fill="#cbd5e1" font-size="17">Docs + Visuals</text></g>
    <g transform="translate(285 180)"><rect width="210" height="170" rx="22" fill="#0b1630" stroke="#60a5fa" stroke-width="2"/><text x="24" y="48" fill="#93c5fd" font-size="22" font-weight="700">COMPATIBILITY</text><text x="24" y="88" fill="#cbd5e1" font-size="17">Python 3.11</text><text x="24" y="116" fill="#cbd5e1" font-size="17">Python 3.12</text><text x="24" y="144" fill="#cbd5e1" font-size="17">Python 3.13</text></g>
    <g transform="translate(520 180)"><rect width="210" height="170" rx="22" fill="#12112f" stroke="#8b5cf6" stroke-width="2"/><text x="28" y="48" fill="#c4b5fd" font-size="22" font-weight="700">LIVE API</text><text x="28" y="88" fill="#cbd5e1" font-size="17">Uvicorn start</text><text x="28" y="116" fill="#cbd5e1" font-size="17">HTTP /health</text><text x="28" y="144" fill="#cbd5e1" font-size="17">Tracing spans</text></g>
    <g transform="translate(755 180)"><rect width="210" height="170" rx="22" fill="#171126" stroke="#d946ef" stroke-width="2"/><text x="28" y="48" fill="#f0abfc" font-size="22" font-weight="700">DOCKER</text><text x="28" y="88" fill="#cbd5e1" font-size="17">Image build</text><text x="28" y="116" fill="#cbd5e1" font-size="17">Container start</text><text x="28" y="144" fill="#cbd5e1" font-size="17">Healthcheck</text></g>
    <g transform="translate(990 180)"><rect width="210" height="170" rx="22" fill="#1c1810" stroke="#f59e0b" stroke-width="2"/><text x="24" y="48" fill="#fde68a" font-size="22" font-weight="700">POSTGRESQL</text><text x="24" y="88" fill="#cbd5e1" font-size="17">Claims</text><text x="24" y="116" fill="#cbd5e1" font-size="17">Heartbeats</text><text x="24" y="144" fill="#cbd5e1" font-size="17">Lease recovery</text></g>
    <g transform="translate(1225 180)"><rect width="205" height="170" rx="22" fill="#09251e" stroke="#34d399" stroke-width="2"/><text x="25" y="48" fill="#6ee7b7" font-size="22" font-weight="700">PROMOTION</text><text x="25" y="88" fill="#cbd5e1" font-size="17">Evidence bundle</text><text x="25" y="116" fill="#cbd5e1" font-size="17">Regression guard</text><text x="25" y="144" fill="#cbd5e1" font-size="17">Release gate</text></g>
  </g>
  <g transform="translate(110 430)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1280" height="120" rx="24" fill="#05101d" stroke="#1e40af" stroke-width="1.5"/>
    <text x="35" y="42" fill="#38bdf8" font-size="20" font-weight="700">LEARNING LOOP</text>
    <text x="35" y="78" fill="#cbd5e1" font-size="18">Verified failure</text><text x="200" y="78" fill="#64748b" font-size="24">→</text><text x="245" y="78" fill="#fbbf24" font-size="18">Failure Taxonomy</text><text x="420" y="78" fill="#64748b" font-size="24">→</text><text x="465" y="78" fill="#f472b6" font-size="18">Regression Corpus</text><text x="645" y="78" fill="#64748b" font-size="24">→</text><text x="690" y="78" fill="#a78bfa" font-size="18">Learning Memory</text><text x="845" y="78" fill="#64748b" font-size="24">→</text><text x="890" y="78" fill="#34d399" font-size="18">Future Missions Improve</text>
    <circle cx="1250" cy="60" r="16" fill="#34d399" filter="url(#glow)"><animate attributeName="r" values="10;20;10" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
