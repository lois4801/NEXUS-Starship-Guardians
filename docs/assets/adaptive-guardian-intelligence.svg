<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive Guardian Intelligence v0.7.0</title>
  <desc id="desc">Animated visualization of specialist Guardians learning from verified outcomes, benchmark replay, coverage gaps, and adaptive routing.</desc>
  <defs>
    <radialGradient id="bg"><stop stop-color="#10213f"/><stop offset="1" stop-color="#020617"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .h{font:800 42px Arial,sans-serif;fill:#eefcff}.s{font:18px Arial,sans-serif;fill:#94a3b8}.l{font:700 18px Arial,sans-serif;fill:#e2e8f0}.t{font:15px Arial,sans-serif;fill:#cbd5e1}.node{fill:#071426;stroke-width:2}.cyan{stroke:#22d3ee}.violet{stroke:#8b5cf6}.amber{stroke:#f59e0b}.green{stroke:#34d399}.pink{stroke:#d946ef}
    </style>
  </defs>
  <rect width="1600" height="1100" rx="36" fill="url(#bg)"/>
  <text x="70" y="78" class="h">ADAPTIVE GUARDIAN INTELLIGENCE</text>
  <text x="72" y="112" class="s">v0.7.0 · verified learning, specialist skill evidence, benchmark replay, coverage intelligence, adaptive routing</text>

  <circle cx="800" cy="555" r="230" fill="none" stroke="url(#ring)" stroke-width="6" stroke-dasharray="20 16" opacity=".65" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0 800 555" to="360 800 555" dur="18s" repeatCount="indefinite"/></circle>
  <circle cx="800" cy="555" r="165" fill="#081426" stroke="#8b5cf6" stroke-width="3" filter="url(#glow)"/>
  <text x="800" y="520" class="l" text-anchor="middle">Adaptive Guardian</text>
  <text x="800" y="548" class="l" text-anchor="middle">Intelligence Core</text>
  <text x="800" y="585" class="t" text-anchor="middle">quality • reliability • benchmark</text>
  <text x="800" y="610" class="t" text-anchor="middle">confidence • trend • regression risk</text>

  <g text-anchor="middle">
    <g transform="translate(70 180)"><rect class="node cyan" width="280" height="95" rx="20"/><text x="140" y="40" class="l">AI Architect</text><text x="140" y="68" class="t">architecture • tradeoffs</text></g>
    <g transform="translate(365 150)"><rect class="node cyan" width="280" height="95" rx="20"/><text x="140" y="40" class="l">Platform Engineer</text><text x="140" y="68" class="t">systems • reliability</text></g>
    <g transform="translate(955 150)"><rect class="node violet" width="280" height="95" rx="20"/><text x="140" y="40" class="l">AI Developer</text><text x="140" y="68" class="t">RAG • model integration</text></g>
    <g transform="translate(1250 180)"><rect class="node violet" width="280" height="95" rx="20"/><text x="140" y="40" class="l">Coder Specialist</text><text x="140" y="68" class="t">implementation • testing</text></g>

    <g transform="translate(35 470)"><rect class="node amber" width="280" height="95" rx="20"/><text x="140" y="40" class="l">AI Engineer</text><text x="140" y="68" class="t">inference • routing</text></g>
    <g transform="translate(1285 470)"><rect class="node amber" width="280" height="95" rx="20"/><text x="140" y="40" class="l">Debugger Specialist</text><text x="140" y="68" class="t">root cause • repair</text></g>

    <g transform="translate(70 790)"><rect class="node green" width="280" height="95" rx="20"/><text x="140" y="40" class="l">AI Scientist</text><text x="140" y="68" class="t">experiments • benchmarks</text></g>
    <g transform="translate(365 825)"><rect class="node green" width="280" height="95" rx="20"/><text x="140" y="40" class="l">AI Cloud Specialist</text><text x="140" y="68" class="t">cloud • scaling • rollback</text></g>
    <g transform="translate(955 825)"><rect class="node pink" width="280" height="95" rx="20"/><text x="140" y="40" class="l">API Specialist</text><text x="140" y="68" class="t">contracts • auth • retries</text></g>
    <g transform="translate(1250 790)"><rect class="node pink" width="280" height="95" rx="20"/><text x="140" y="40" class="l">AI Programmer</text><text x="140" y="68" class="t">automation • algorithms</text></g>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="9 8" opacity=".7">
    <path d="M350 228 C520 250 600 360 690 435"/><path d="M645 198 C700 280 735 330 760 390"/>
    <path d="M955 198 C900 280 865 330 840 390"/><path d="M1250 228 C1080 250 1000 360 910 435"/>
    <path d="M315 517 C480 520 560 540 635 548"/><path d="M1285 517 C1120 520 1040 540 965 548"/>
    <path d="M350 837 C520 810 610 720 690 665"/><path d="M645 872 C700 790 735 740 760 720"/>
    <path d="M955 872 C900 790 865 740 840 720"/><path d="M1250 837 C1080 810 990 720 910 665"/>
  </g>

  <path d="M610 555 H455" stroke="#22d3ee" stroke-width="5" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" values="0;-44" dur="1.4s" repeatCount="indefinite"/></path>
  <g transform="translate(250 505)"><rect class="node cyan" width="205" height="100" rx="18"/><text x="102" y="39" class="l" text-anchor="middle">Verified Outcomes</text><text x="102" y="67" class="t" text-anchor="middle">tests • judges • evidence</text></g>

  <path d="M990 555 H1140" stroke="#f59e0b" stroke-width="5" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" values="0;-44" dur="1.6s" repeatCount="indefinite"/></path>
  <g transform="translate(1140 505)"><rect class="node amber" width="210" height="100" rx="18"/><text x="105" y="39" class="l" text-anchor="middle">Adaptive Routing</text><text x="105" y="67" class="t" text-anchor="middle">bounded evidence bonus</text></g>

  <g transform="translate(610 925)"><rect class="node pink" width="380" height="105" rx="20"/><text x="190" y="38" class="l" text-anchor="middle">Benchmark Replay + Coverage</text><text x="190" y="67" class="t" text-anchor="middle">reproduce failures • find domain gaps</text><text x="190" y="91" class="t" text-anchor="middle">gaps become targeted training priorities</text></g>
  <path d="M800 720 V925" stroke="#d946ef" stroke-width="5" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" values="0;-44" dur="1.8s" repeatCount="indefinite"/></path>

  <text x="70" y="1060" class="s">Automatic adaptation changes evidence, priorities, and routing preference—not credentials, tool permissions, live model weights, or benchmark approval.</text>
</svg>
