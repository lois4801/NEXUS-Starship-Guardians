<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1900" viewBox="0 0 1500 1900" role="img" aria-labelledby="title desc">
  <title id="title">Nexus Starship Guardians current state graph</title>
  <desc id="desc">Animated current architecture from mission intelligence through release, plus ChatGPT Codex plugin, REST v1 adapter, GitHub Releases, and GHCR packages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".48" stop-color="#07152e"/><stop offset="1" stop-color="#1a0b2e"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22d3ee"/><stop offset=".45" stop-color="#8b5cf6"/><stop offset=".75" stop-color="#f59e0b"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font:800 46px Arial,Helvetica,sans-serif;fill:#ecfeff}.sub{font:20px Arial,Helvetica,sans-serif;fill:#94a3b8}.label{font:700 23px Arial,Helvetica,sans-serif;fill:#e2e8f0}.small{font:17px Arial,Helvetica,sans-serif;fill:#cbd5e1}.box{fill:#071426;stroke-width:2}.cyan{stroke:#22d3ee}.blue{stroke:#60a5fa}.violet{stroke:#8b5cf6}.pink{stroke:#d946ef}.amber{stroke:#f59e0b}.green{stroke:#34d399}
    </style>
  </defs>
  <rect width="1500" height="1900" rx="34" fill="url(#bg)"/>
  <text x="80" y="78" class="title">NEXUS STARSHIP GUARDIANS — CURRENT STATE</text>
  <text x="82" y="116" class="sub">Mission → route → execute → verify → repair → evaluate → learn → promote → release</text>

  <path d="M750 180 V1510" stroke="url(#flow)" stroke-width="8" stroke-dasharray="20 18" opacity=".6" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-76" dur="2.6s" repeatCount="indefinite"/></path>

  <g text-anchor="middle">
    <g transform="translate(510 155)"><rect class="box cyan" width="480" height="88" rx="22"/><text x="240" y="54" class="label">Mission Intelligence</text></g>
    <g transform="translate(510 270)"><rect class="box blue" width="480" height="88" rx="22"/><text x="240" y="54" class="label">Capability Map</text></g>
    <g transform="translate(510 385)"><rect class="box violet" width="480" height="88" rx="22"/><text x="240" y="54" class="label">Guardian Registry</text></g>
    <g transform="translate(510 500)"><rect class="box pink" width="480" height="88" rx="22"/><text x="240" y="54" class="label">Adaptive Router</text></g>
  </g>

  <g text-anchor="middle">
    <g transform="translate(150 635)"><rect class="box cyan" width="330" height="100" rx="22"/><text x="165" y="58" class="label">Models</text></g>
    <g transform="translate(585 635)"><rect class="box violet" width="330" height="100" rx="22"/><text x="165" y="58" class="label">Guardians</text></g>
    <g transform="translate(1020 635)"><rect class="box amber" width="330" height="100" rx="22"/><text x="165" y="58" class="label">Tools</text></g>
  </g>
  <path d="M675 588 L315 635 M750 588 V635 M825 588 L1185 635" fill="none" stroke="#94a3b8" stroke-width="3" opacity=".8"/>
  <path d="M315 735 L650 805 M750 735 V805 M1185 735 L850 805" fill="none" stroke="#94a3b8" stroke-width="3" opacity=".8"/>

  <g text-anchor="middle">
    <g transform="translate(510 805)"><rect class="box blue" width="480" height="88" rx="22"/><text x="240" y="54" class="label">Execution DAG</text></g>
    <g transform="translate(510 920)"><rect class="box cyan" width="480" height="88" rx="22"/><text x="240" y="54" class="label">Verification Grid</text></g>
    <g transform="translate(510 1035)"><rect class="box amber" width="480" height="88" rx="22"/><text x="240" y="54" class="label">Auto Repair</text></g>
    <g transform="translate(510 1150)"><rect class="box violet" width="480" height="88" rx="22"/><text x="240" y="54" class="label">Evidence Bundle</text></g>
    <g transform="translate(510 1265)"><rect class="box pink" width="480" height="88" rx="22"/><text x="240" y="54" class="label">Multi-Judge Evaluation</text></g>
    <g transform="translate(510 1380)"><rect class="box amber" width="480" height="88" rx="22"/><text x="240" y="54" class="label">Regression Corpus</text></g>
    <g transform="translate(510 1495)"><rect class="box violet" width="480" height="88" rx="22"/><text x="240" y="54" class="label">Learning Memory</text></g>
    <g transform="translate(510 1610)"><rect class="box green" width="480" height="88" rx="22"/><text x="240" y="54" class="label">Promotion Gate</text></g>
    <g transform="translate(510 1725)"><rect class="box green" width="480" height="88" rx="22"/><text x="240" y="54" class="label">Release</text></g>
  </g>

  <g transform="translate(70 1210)">
    <rect width="350" height="230" rx="24" fill="#09182c" stroke="#60a5fa" stroke-width="2"/>
    <text x="28" y="48" class="label">ChatGPT / Codex Plugin</text>
    <text x="28" y="88" class="small">nexus-starship-guardians v0.3</text>
    <text x="28" y="122" class="small">Skills • approvals • integration</text>
    <text x="28" y="156" class="small">Guardian terminology</text>
    <text x="28" y="190" class="small">REST v1 compatibility</text>
  </g>
  <g transform="translate(1080 1210)">
    <rect width="350" height="230" rx="24" fill="#09182c" stroke="#8b5cf6" stroke-width="2"/>
    <text x="28" y="48" class="label">Nexus REST v1 Adapter</text>
    <text x="28" y="88" class="small">Project-scoped auth</text>
    <text x="28" y="122" class="small">Approval gates</text>
    <text x="28" y="156" class="small">Legacy agent/agents fields</text>
    <text x="28" y="190" class="small">Compatibility only</text>
  </g>
  <path d="M420 1325 H500 M1000 1325 H1080" stroke="#a78bfa" stroke-width="4" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" values="0;-44" dur="1.8s" repeatCount="indefinite"/></path>

  <g transform="translate(70 1630)">
    <rect width="350" height="180" rx="24" fill="#09251e" stroke="#34d399" stroke-width="2"/>
    <text x="28" y="48" class="label">GitHub Release</text>
    <text x="28" y="90" class="small">Versioned source</text>
    <text x="28" y="124" class="small">Python wheel + sdist</text>
    <text x="28" y="158" class="small">Release notes</text>
  </g>
  <g transform="translate(1080 1630)">
    <rect width="350" height="180" rx="24" fill="#09251e" stroke="#34d399" stroke-width="2"/>
    <text x="28" y="48" class="label">GitHub Package</text>
    <text x="28" y="90" class="small">GHCR container</text>
    <text x="28" y="124" class="small">Versioned Docker image</text>
    <text x="28" y="158" class="small">latest + semver tags</text>
  </g>
  <path d="M510 1769 H420 M990 1769 H1080" stroke="#34d399" stroke-width="4" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" values="0;-44" dur="1.8s" repeatCount="indefinite"/></path>
</svg>
