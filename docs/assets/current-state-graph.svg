  <path d="M510 1842 L420 1985 M990 1842 L1080 1985" stroke="#34d399" stroke-width="4" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" values="0;-44" dur="1.8s" repeatCount="indefinite"/></path>
