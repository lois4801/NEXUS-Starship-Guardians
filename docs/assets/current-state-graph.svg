    <text x="24" y="76" class="small">Lucio AI Platform</text><text x="24" y="106" class="small">Ember</text><text x="24" y="136" class="small">Nexus Code</text><text x="24" y="166" class="small">Railway</text><text x="24" y="196" class="small">Supabase</text><text x="24" y="228" class="small">readiness ≠ connection</text>
