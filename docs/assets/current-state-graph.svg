<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2680" viewBox="0 0 1500 2680" role="img" aria-labelledby="title desc">
  <title id="title">Nexus Starship Guardians v0.7.1 current state graph</title>
  <desc id="desc">Animated architecture showing live Adaptive Guardian Intelligence, automatic verified specialist learning, Benchmark Replay, Coverage Intelligence, Guardian routing, verified execution, governed benchmark learning, and releases.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".45" stop-color="#07152e"/><stop offset="1" stop-color="#1a0b2e"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22d3ee"/><stop offset=".26" stop-color="#60a5fa"/><stop offset=".52" stop-color="#8b5cf6"/><stop offset=".76" stop-color="#f59e0b"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font:800 44px Arial,Helvetica,sans-serif;fill:#ecfeff}.sub{font:20px Arial,Helvetica,sans-serif;fill:#94a3b8}.label{font:700 21px Arial,Helvetica,sans-serif;fill:#e2e8f0}.small{font:16px Arial,Helvetica,sans-serif;fill:#cbd5e1}.tiny{font:14px Arial,Helvetica,sans-serif;fill:#94a3b8}.box{fill:#071426;stroke-width:2}.cyan{stroke:#22d3ee}.blue{stroke:#60a5fa}.violet{stroke:#8b5cf6}.pink{stroke:#d946ef}.amber{stroke:#f59e0b}.green{stroke:#34d399}
    </style>
  </defs>
  <rect width="1500" height="2680" rx="34" fill="url(#bg)"/>
