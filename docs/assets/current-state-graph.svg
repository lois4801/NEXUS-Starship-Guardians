<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2200" viewBox="0 0 1500 2200" role="img" aria-labelledby="title desc">
  <title id="title">Nexus Starship Guardians v0.4 current state graph</title>
  <desc id="desc">Animated current architecture with live mission intelligence, capability mapping, adaptive Guardian routing, controlled tool gateway, integration readiness contracts, verified execution, learning, releases, and packages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".48" stop-color="#07152e"/><stop offset="1" stop-color="#1a0b2e"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22d3ee"/><stop offset=".45" stop-color="#8b5cf6"/><stop offset=".75" stop-color="#f59e0b"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font:800 44px Arial,Helvetica,sans-serif;fill:#ecfeff}.sub{font:20px Arial,Helvetica,sans-serif;fill:#94a3b8}.label{font:700 22px Arial,Helvetica,sans-serif;fill:#e2e8f0}.small{font:16px Arial,Helvetica,sans-serif;fill:#cbd5e1}.box{fill:#071426;stroke-width:2}.cyan{stroke:#22d3ee}.blue{stroke:#60a5fa}.violet{stroke:#8b5cf6}.pink{stroke:#d946ef}.amber{stroke:#f59e0b}.green{stroke:#34d399}
    </style>
  </defs>
  <rect width="1500" height="2200" rx="34" fill="url(#bg)"/>
  <text x="80" y="78" class="title">NEXUS STARSHIP GUARDIANS v0.4 — CURRENT STATE</text>
  <text x="82" y="116" class="sub">Classify → map → route → authorize → execute → verify → learn → promote → release</text>

  <path d="M750 165 V1870" stroke="url(#flow)" stroke-width="8" stroke-dasharray="20 18" opacity=".58" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-76" dur="2.6s" repeatCount="indefinite"/></path>

  <g text-anchor="middle">
    <g transform="translate(510 150)"><rect class="box cyan" width="480" height="84" rx="22"/><text x="240" y="52" class="label">Mission Intelligence</text></g>
    <g transform="translate(510 260)"><rect class="box cyan" width="480" height="84" rx="22"/><text x="240" y="52" class="label">Live Mission Runtime</text></g>
    <g transform="translate(510 370)"><rect class="box blue" width="480" height="84" rx="22"/><text x="240" y="52" class="label">Capability Map</text></g>
    <g transform="translate(510 480)"><rect class="box violet" width="480" height="84" rx="22"/><text x="240" y="52" class="label">Guardian Registry</text></g>
    <g transform="translate(510 590)"><rect class="box pink" width="480" height="84" rx="22"/><text x="240" y="52" class="label">Adaptive Team Router</text></g>
  </g>

  <g text-anchor="middle">
