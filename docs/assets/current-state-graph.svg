    <linearGradient id="flow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22d3ee"/><stop offset=".35" stop-color="#8b5cf6"/><stop offset=".7" stop-color="#f59e0b"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.title{font:800 42px Arial,sans-serif;fill:#ecfeff}.sub{font:19px Arial,sans-serif;fill:#94a3b8}.label{font:700 20px Arial,sans-serif;fill:#e2e8f0}.small{font:15px Arial,sans-serif;fill:#cbd5e1}.tiny{font:14px Arial,sans-serif;fill:#94a3b8}.box{fill:#071426;stroke-width:2}.cyan{stroke:#22d3ee}.blue{stroke:#60a5fa}.violet{stroke:#8b5cf6}.pink{stroke:#d946ef}.amber{stroke:#f59e0b}.green{stroke:#34d399}</style>
