<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Starship Guardians — A Luxury Guardian Engineering Runtime</title>
<meta name="description" content="Thirty-two evolving specialist Guardians. One company of 650. Verified learning, governed intelligence, cinematic engineering.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#070D22; --bg1:#0A1128; --bg2:#0D0B26;
  --ink:#F4F8FF; --mut:#9FB3D9; --dim:#5F739E;
  --gold:#C9A86A; --gold-soft:#AF915F; --cream:#FCE9C8;
  --emerald:#2AF598; --cyan:#08AEEA; --violet:#A855F7; --magenta:#F857A6; --orange:#FF9A44; --amber:#F2A24A; --lime:#A8FF78;
  --grad-flow:linear-gradient(100deg,#2AF598 0%,#08AEEA 32%,#A855F7 62%,#F857A6 82%,#FF9A44 100%);
  --line:rgba(201,168,106,.22); --line-soft:rgba(255,255,255,.08);
  --font-d:'Space Grotesk',-apple-system,sans-serif;
  --font-s:'Instrument Serif',Georgia,serif;
  --font-b:'Inter',-apple-system,sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.19,1,.22,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-width:thin;scrollbar-color:rgba(201,168,106,.4) transparent}
body{
  background:var(--bg0);color:var(--ink);
  font-family:var(--font-b);font-weight:300;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background-color .9s var(--ease);
}
::selection{background:rgba(42,245,152,.25);color:#fff}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.mono{font-family:var(--font-m)}
.serif-i{font-family:var(--font-s);font-style:italic;font-weight:400}
.wrap{max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,64px)}
h1,h2,h3{font-family:var(--font-d);font-weight:500;letter-spacing:-.035em}
.grad{background:var(--grad-flow);-webkit-background-clip:text;background-clip:text;color:transparent}
.gold{color:var(--gold)}

/* ---------- cursor ---------- */
.cursor-dot,.cursor-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;border-radius:50%;transform:translate(-50%,-50%)}
.cursor-dot{width:6px;height:6px;background:var(--gold)}
.cursor-ring{width:38px;height:38px;border:1px solid rgba(201,168,106,.55);display:flex;align-items:center;justify-content:center;transition:width .35s var(--ease),height .35s var(--ease),background-color .35s,border-color .35s}
.cursor-ring span{font-family:var(--font-m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bg0);opacity:0;transition:opacity .25s}
.cursor-ring.big{width:84px;height:84px;background:var(--gold);border-color:var(--gold)}
.cursor-ring.big span{opacity:1}
@media (pointer:coarse){.cursor-dot,.cursor-ring{display:none}}

/* ---------- preloader ---------- */
#loader{position:fixed;inset:0;z-index:9000;background:var(--bg0);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:26px}
#loader .l-word{font-family:var(--font-d);font-size:clamp(28px,4vw,44px);letter-spacing:.42em;text-indent:.42em;overflow:hidden}
#loader .l-word span{display:inline-block;transform:translateY(110%)}
#loader .l-pct{font-family:var(--font-m);font-size:13px;letter-spacing:.3em;color:var(--gold)}
#loader .l-bar{width:min(320px,60vw);height:1px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
#loader .l-bar i{position:absolute;inset:0;background:var(--grad-flow);transform-origin:left;transform:scaleX(0)}
#loader .l-sub{font-family:var(--font-m);font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim)}

/* ---------- header ---------- */
header.site{position:fixed;inset:0 0 auto 0;z-index:800;backdrop-filter:blur(14px);background:rgba(7,13,34,.5);border-bottom:1px solid transparent;transition:border-color .5s}
header.site.scrolled{border-bottom-color:var(--line-soft)}
.h-in{display:flex;align-items:center;height:66px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--font-d);font-weight:700;font-size:14px;letter-spacing:.18em}
.brand svg{shape-rendering:geometricPrecision}
.h-nav{display:flex;gap:30px;margin-left:auto;font-family:var(--font-m);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.h-nav a{position:relative;padding:4px 0;transition:color .3s}
.h-nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.h-nav a:hover{color:var(--ink)}
.h-nav a:hover::after{transform:scaleX(1);transform-origin:left}
.h-clock{font-family:var(--font-m);font-size:11px;letter-spacing:.14em;color:var(--gold);margin-left:34px}
.h-cta{margin-left:26px;font-family:var(--font-m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bg0);background:var(--gold);padding:9px 18px;border-radius:99px;transition:transform .3s var(--ease),box-shadow .3s}
.h-cta:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(201,168,106,.35)}
@media(max-width:900px){.h-nav,.h-clock{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.hero-media{position:absolute;inset:0;z-index:0}
.hero-media img{width:100%;height:118%;object-fit:cover;will-change:transform}
.hero-veil{position:absolute;inset:0;z-index:1;background:
  linear-gradient(180deg,rgba(7,13,34,.55) 0%,rgba(7,13,34,.15) 40%,rgba(7,13,34,.86) 88%),
  radial-gradient(90% 60% at 50% 110%,rgba(7,13,34,.7),transparent 70%)}
.hero-in{position:relative;z-index:2;padding-bottom:clamp(30px,4vh,56px);padding-top:120px}
.hero-eyebrow{display:flex;align-items:center;gap:16px;font-family:var(--font-m);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:26px}
.hero-eyebrow::before{content:"";width:56px;height:1px;background:var(--gold)}
.hero h1{font-size:clamp(46px,8.4vw,118px);line-height:.96;text-transform:uppercase}
.hero h1 .row{display:block;overflow:hidden}
.hero h1 .row>span{display:inline-block;will-change:transform}
.hero h1 .thin{font-weight:400;color:var(--mut)}
.hero-lede{max-width:640px;color:var(--mut);font-size:clamp(15px,1.4vw,18px);line-height:1.75;margin-top:26px}
.hero-lede strong{color:var(--ink);font-weight:500}
.hero-ctas{display:flex;gap:16px;margin-top:30px;flex-wrap:wrap}
.btn{position:relative;display:inline-flex;align-items:center;gap:12px;font-family:var(--font-m);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;padding:17px 32px;border-radius:99px;overflow:hidden;transition:color .4s,border-color .4s;will-change:transform}
.btn svg{transition:transform .45s var(--ease)}
.btn:hover svg{transform:translate(4px,-4px)}
.btn-fill{background:var(--gold);color:var(--bg0)}
.btn-fill:hover{box-shadow:0 14px 40px rgba(201,168,106,.35)}
.btn-line{border:1px solid var(--line);color:var(--ink)}
.btn-line::before{content:"";position:absolute;inset:0;background:var(--grad-flow);transform:translateY(101%);transition:transform .5s var(--ease);z-index:-1}
.btn-line:hover{border-color:transparent;color:var(--bg0)}
.btn-line:hover::before{transform:translateY(0)}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);border-top:1px solid var(--line-soft);margin-top:clamp(28px,4.5vh,52px)}
.hstat{background:rgba(7,13,34,.55);backdrop-filter:blur(8px);padding:26px clamp(14px,2vw,30px)}
.hstat .n{font-family:var(--font-d);font-weight:700;font-size:clamp(26px,3.2vw,44px);letter-spacing:-.02em}
.hstat .n em{font-style:normal;color:var(--gold)}
.hstat .l{font-family:var(--font-m);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.scroll-cue{position:absolute;right:clamp(20px,4vw,64px);bottom:190px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:12px;font-family:var(--font-m);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);writing-mode:vertical-rl}
.scroll-cue i{width:1px;height:64px;background:linear-gradient(180deg,var(--gold),transparent);animation:cue 2.2s var(--ease) infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media(max-width:760px){.hero-stats{grid-template-columns:repeat(2,1fr)}.scroll-cue{display:none}}
</style>
</head>
<style>
/* ---------- marquee ---------- */
.marquee{overflow:hidden;border-block:1px solid var(--line-soft);padding:20px 0;white-space:nowrap;background:rgba(255,255,255,.015)}
.mq-in{display:inline-flex;animation:mq 46s linear infinite}
.mq-in span{font-family:var(--font-d);font-weight:500;font-size:clamp(16px,1.6vw,22px);letter-spacing:.3em;text-transform:uppercase;color:var(--dim);padding:0 26px;display:flex;align-items:center;gap:26px}
.mq-in span::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- section chrome ---------- */
section{position:relative}
.sec-head{display:flex;align-items:baseline;gap:26px;margin-bottom:clamp(40px,6vh,72px)}
.sec-idx{font-family:var(--font-m);font-size:12px;letter-spacing:.3em;color:var(--gold)}
.sec-title{font-size:clamp(34px,4.6vw,64px);text-transform:uppercase;line-height:1}
.sec-rule{flex:1;height:1px;background:var(--line);align-self:center}
.sec-kick{font-family:var(--font-m);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}

/* ---------- manifesto ---------- */
.mani{padding:clamp(110px,16vh,190px) 0}
.mani-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0 28px}
.mani-copy{grid-column:1/9}
.mani-copy p{font-family:var(--font-d);font-weight:400;font-size:clamp(26px,3.4vw,50px);line-height:1.28;letter-spacing:-.02em}
.mani-copy .w{opacity:.14;display:inline-block}
.mani-copy .acc{font-family:var(--font-s);font-style:italic;font-weight:400;letter-spacing:0}
.mani-copy .c-em{color:var(--emerald)}.mani-copy .c-cy{color:var(--cyan)}.mani-copy .c-mg{color:var(--magenta)}.mani-copy .c-am{color:var(--amber)}
.mani-meta{grid-column:10/13;align-self:end;padding-bottom:8px}
.mani-meta p{color:var(--mut);font-size:14.5px;line-height:1.8}
.mani-meta .sig{margin-top:26px;font-family:var(--font-m);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);border-top:1px solid var(--line);padding-top:18px}
.mani-fig{grid-column:2/12;margin-top:clamp(60px,9vh,110px);border-radius:22px;overflow:hidden;position:relative;border:1px solid var(--line-soft)}
.mani-fig img{width:100%;height:130%;object-fit:cover;will-change:transform}
.mani-fig figcaption{position:absolute;left:26px;bottom:22px;font-family:var(--font-m);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(244,248,255,.85);background:rgba(7,13,34,.55);backdrop-filter:blur(8px);padding:9px 16px;border-radius:99px;border:1px solid var(--line-soft)}
@media(max-width:900px){.mani-copy{grid-column:1/13}.mani-meta{grid-column:1/13;margin-top:34px}.mani-fig{grid-column:1/13}}

/* ---------- systems index rows ---------- */
.sys{padding:clamp(90px,13vh,160px) 0}
.sys-row{display:grid;grid-template-columns:80px 1fr 1.1fr 60px;gap:28px;align-items:center;padding:clamp(28px,4vh,44px) 0;border-top:1px solid var(--line-soft);position:relative;cursor:pointer}
.sys-row:last-child{border-bottom:1px solid var(--line-soft)}
.sys-row::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:100%;background:var(--grad-flow);transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
.sys-row:hover::after{transform:scaleX(1)}
.sys-num{font-family:var(--font-m);font-size:12px;color:var(--gold);letter-spacing:.2em}
.sys-name{font-family:var(--font-d);font-weight:500;font-size:clamp(22px,2.6vw,36px);letter-spacing:-.02em;line-height:1.1;transition:transform .5s var(--ease),color .4s}
.sys-row:hover .sys-name{transform:translateX(14px)}
.sys-desc{color:var(--mut);font-size:14.5px;line-height:1.75;max-width:520px}
.sys-arr{font-family:var(--font-m);color:var(--dim);font-size:18px;text-align:right;transition:transform .5s var(--ease),color .4s}
.sys-row:hover .sys-arr{transform:translate(6px,-6px);color:var(--gold)}
.sys-tag{display:inline-block;font-family:var(--font-m);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line-soft);border-radius:99px;padding:5px 12px;margin-bottom:12px}
@media(max-width:900px){.sys-row{grid-template-columns:50px 1fr;grid-template-rows:auto auto}.sys-desc{grid-column:2}.sys-arr{display:none}}

/* ---------- company: horizontal ---------- */
.company{overflow:hidden}
.co-pin{height:100vh;display:flex;align-items:center;overflow:hidden}
.co-track{display:flex;gap:clamp(30px,4vw,70px);padding:0 clamp(20px,4vw,64px);will-change:transform}
.co-panel{flex:0 0 auto;width:min(72vw,860px);min-height:64vh;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line-soft);border-radius:26px;padding:clamp(30px,4vw,56px);position:relative;overflow:hidden;background:rgba(255,255,255,.02)}
.co-panel .glow{position:absolute;width:480px;height:480px;border-radius:50%;filter:blur(120px);opacity:.16;top:-160px;right:-120px}
.co-tag{font-family:var(--font-m);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.co-big{font-family:var(--font-d);font-weight:700;font-size:clamp(96px,15vw,220px);line-height:.9;letter-spacing:-.045em;margin:26px 0 8x}
